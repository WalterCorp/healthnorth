{% extends 'base.html' %}

{% block title %}Nouveau rendez-vous — Health North{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3>Prendre un rendez-vous</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Sélection du spécialiste -->
                    <!-- La liste vient de appointments/views.py -->
                    <div class="mb-3">
                        <label class="form-label">Spécialiste</label>
                        <select name="specialist" class="form-select" required>
                            <option value="">-- Choisir un spécialiste --</option>
                            <!-- Boucle sur les spécialistes disponibles -->
                            {% for specialist in specialists %}
                                <option value="{{ specialist.id }}">
                                    <!-- Affiche nom + spécialité du médecin -->
                                    {{ specialist }} — {{ specialist.specialty }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Sélection du type d'examen -->
                    <!-- La liste vient de appointments/views.py -->
                    <div class="mb-3">
                        <label class="form-label">Type d'examen</label>
                        <select name="exam_type" class="form-select" required>
                            <option value="">-- Choisir un type d'examen --</option>
                            <!-- Boucle sur les types d'examens disponibles -->
                            <!-- Affiche nom + durée estimée -->
                            {% for exam in exam_types %}
                                <option value="{{ exam.id }}">
                                    {{ exam.name }} — {{ exam.duration_minutes }} min
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Sélection de la date et heure -->
                    <div class="mb-3">
                        <label class="form-label">Date et heure</label>
                        <!-- datetime-local : sélecteur date + heure natif HTML5 -->
                        <!-- min="{{ now }}" : empêche de choisir une date passée -->
                        <!-- now est injecté depuis la vue via le contexte -->
                        <input
                            type="datetime-local"
                            name="date"
                            class="form-control"
                            min="{{ now }}"
                            required>
                    </div>

                    <!-- Notes optionnelles pour le médecin -->
                    <div class="mb-3">
                        <label class="form-label">Notes (optionnel)</label>
                        <textarea
                            name="notes"
                            class="form-control"
                            rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Voir le récapitulatif
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
