{% extends 'base.html' %}

{% block title %}Nouveau rendez-vous — Health North{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-plus-circle me-2"></i>Prendre un rendez-vous
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-geo-alt me-1 text-muted"></i>Région</label>
                        <select name="region" id="region-select" class="form-select" required>
                            <option value="">-- Choisir une région --</option>
                            {% for value, label in regions %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-building me-1 text-muted"></i>Ville</label>
                        <select name="city" id="city-select" class="form-select" required disabled>
                            <option value="">-- Choisir une région d'abord --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-hospital me-1 text-muted"></i>Clinique</label>
                        <select name="clinic" id="clinic-select" class="form-select" required disabled>
                            <option value="">-- Choisir une ville d'abord --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person-badge me-1 text-muted"></i>Spécialiste</label>
                        <select name="specialist" id="specialist-select" class="form-select" required disabled>
                            <option value="">-- Choisir une clinique d'abord --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-clipboard2-pulse me-1 text-muted"></i>Type d'examen</label>
                        <select name="exam_type" id="exam-type-select" class="form-select" required disabled>
                            <option value="">-- Choisir un spécialiste d'abord --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-calendar2-event me-1 text-muted"></i>Date et heure</label>
                        <input type="datetime-local" name="date" class="form-control" min="{{ now }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-chat-text me-1 text-muted"></i>Notes (optionnel)</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Informations utiles pour le médecin..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-arrow-right-circle me-2"></i>Voir le récapitulatif
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('region-select').addEventListener('change', function () {
        const region = this.value;
        const citySelect = document.getElementById('city-select');
        const clinicSelect = document.getElementById('clinic-select');
        const specialistSelect = document.getElementById('specialist-select');
        const examSelect = document.getElementById('exam-type-select');

        citySelect.innerHTML = '<option value="">-- Choisir une ville --</option>';
        clinicSelect.innerHTML = '<option value="">-- Choisir une ville d\'abord --</option>';
        specialistSelect.innerHTML = '<option value="">-- Choisir une clinique d\'abord --</option>';
        examSelect.innerHTML = '<option value="">-- Choisir un spécialiste d\'abord --</option>';
        citySelect.disabled = true;
        clinicSelect.disabled = true;
        specialistSelect.disabled = true;
        examSelect.disabled = true;

        if (!region) return;

        fetch(`/appointments/api/cities/${region}/`)
            .then(response => response.json())
            .then(cities => {
                if (cities.length === 0) {
                    citySelect.innerHTML = '<option value="">-- Aucune ville disponible --</option>';
                    return;
                }
                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
                citySelect.disabled = false;
            });
    });

    document.getElementById('city-select').addEventListener('change', function () {
        const city = this.value;
        const clinicSelect = document.getElementById('clinic-select');
        const specialistSelect = document.getElementById('specialist-select');
        const examSelect = document.getElementById('exam-type-select');

        clinicSelect.innerHTML = '<option value="">-- Choisir une clinique --</option>';
        specialistSelect.innerHTML = '<option value="">-- Choisir une clinique d\'abord --</option>';
        examSelect.innerHTML = '<option value="">-- Choisir un spécialiste d\'abord --</option>';
        clinicSelect.disabled = true;
        specialistSelect.disabled = true;
        examSelect.disabled = true;

        if (!city) return;

        fetch(`/appointments/api/clinics/${city}/`)
            .then(response => response.json())
            .then(clinics => {
                if (clinics.length === 0) {
                    clinicSelect.innerHTML = '<option value="">-- Aucune clinique disponible --</option>';
                    return;
                }
                clinics.forEach(clinic => {
                    const option = document.createElement('option');
                    option.value = clinic.id;
                    option.textContent = `${clinic.name} — ${clinic.address}`;
                    clinicSelect.appendChild(option);
                });
                clinicSelect.disabled = false;
            });
    });

    document.getElementById('clinic-select').addEventListener('change', function () {
        const clinicId = this.value;
        const specialistSelect = document.getElementById('specialist-select');
        const examSelect = document.getElementById('exam-type-select');

        specialistSelect.innerHTML = '<option value="">-- Choisir un spécialiste --</option>';
        examSelect.innerHTML = '<option value="">-- Choisir un spécialiste d\'abord --</option>';
        specialistSelect.disabled = true;
        examSelect.disabled = true;

        if (!clinicId) return;

        fetch(`/appointments/api/specialists/${clinicId}/`)
            .then(response => response.json())
            .then(specialists => {
                if (specialists.length === 0) {
                    specialistSelect.innerHTML = '<option value="">-- Aucun spécialiste disponible --</option>';
                    return;
                }
                specialists.forEach(specialist => {
                    const option = document.createElement('option');
                    option.value = specialist.id;
                    option.textContent = `${specialist.name} — ${specialist.specialty}`;
                    specialistSelect.appendChild(option);
                });
                specialistSelect.disabled = false;
            });
    });

    document.getElementById('specialist-select').addEventListener('change', function () {
        const specialistId = this.value;
        const examSelect = document.getElementById('exam-type-select');

        examSelect.innerHTML = '<option value="">-- Choisir un type d\'examen --</option>';
        examSelect.disabled = true;

        if (!specialistId) return;

        fetch(`/appointments/api/exam-types/${specialistId}/`)
            .then(response => response.json())
            .then(examTypes => {
                if (examTypes.length === 0) {
                    examSelect.innerHTML = '<option value="">-- Aucun examen disponible --</option>';
                    return;
                }
                examTypes.forEach(exam => {
                    const option = document.createElement('option');
                    option.value = exam.id;
                    option.textContent = `${exam.name} — ${exam.duration_minutes} min`;
                    examSelect.appendChild(option);
                });
                examSelect.disabled = false;
            });
    });
</script>
{% endblock %}
