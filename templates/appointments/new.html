{% extends 'base.html' %}

{% block title %}Nouveau rendez-vous — Health North{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3>Prendre un rendez-vous</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Sélection du spécialiste -->
                    <div class="mb-3">
                        <label class="form-label">Spécialiste</label>
                        <select name="specialist" id="specialist-select" class="form-select" required>
                            <option value="">-- Choisir un spécialiste --</option>
                            {% for specialist in specialists %}
                                <option value="{{ specialist.id }}">
                                    {{ specialist }} — {{ specialist.specialty }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Sélection du type d'examen — mis à jour dynamiquement via JS -->
                    <div class="mb-3">
                        <label class="form-label">Type d'examen</label>
                        <select name="exam_type" id="exam-type-select" class="form-select" required>
                            <option value="">-- Choisir un spécialiste d'abord --</option>
                        </select>
                    </div>

                    <!-- Sélection de la date et heure -->
                    <div class="mb-3">
                        <label class="form-label">Date et heure</label>
                        <input
                            type="datetime-local"
                            name="date"
                            class="form-control"
                            min="{{ now }}"
                            required>
                    </div>

                    <!-- Notes optionnelles pour le médecin -->
                    <div class="mb-3">
                        <label class="form-label">Notes (optionnel)</label>
                        <textarea
                            name="notes"
                            class="form-control"
                            rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Voir le récapitulatif
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Écoute le changement de spécialiste
    document.getElementById('specialist-select').addEventListener('change', function () {
        const specialistId = this.value;
        const examSelect = document.getElementById('exam-type-select');

        // Réinitialise la liste des examens
        examSelect.innerHTML = '<option value="">-- Choisir un type d\'examen --</option>';

        // Si aucun spécialiste sélectionné, on s'arrête là
        if (!specialistId) return;

        // Appel à l'API Django pour récupérer les examens filtrés
        // L'URL correspond à la route api/exam-types/<specialist_id>/
        fetch(`/appointments/api/exam-types/${specialistId}/`)
            .then(response => response.json())
            .then(examTypes => {
                if (examTypes.length === 0) {
                    // Aucun examen disponible pour cette spécialité
                    examSelect.innerHTML = '<option value="">-- Aucun examen disponible --</option>';
                    return;
                }
                // Ajoute chaque examen comme option dans la liste
                examTypes.forEach(exam => {
                    const option = document.createElement('option');
                    option.value = exam.id;
                    option.textContent = `${exam.name} — ${exam.duration_minutes} min`;
                    examSelect.appendChild(option);
                });
            });
    });
</script>

{% endblock %}
