{% extends 'base.html' %}

{% block title %}Modifier le mot de passe — Health North{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3>Modifier le mot de passe</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    <!-- Protection CSRF obligatoire sur tout formulaire POST -->
                    {% csrf_token %}
                    <!-- PasswordChangeForm génère automatiquement 3 champs :
                         - Ancien mot de passe (vérification sécurité)
                         - Nouveau mot de passe
                         - Confirmation du nouveau mot de passe -->
                    {{ form.as_p }}
                    <!-- Bouton de soumission -->
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Modifier le mot de passe
                    </button>
                    <!-- Lien retour vers le profil sans modifier le mot de passe -->
                    <a href="/accounts/profile/" class="btn btn-secondary w-100 mt-2">
                        Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
