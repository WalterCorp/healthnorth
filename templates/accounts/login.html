{% extends 'base.html' %}

{% block title %}Connexion — Health North{% endblock %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-4 offset-md-4">
        <div class="card">
            <div class="card-header">
                <h3>Connexion</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    <!-- Protection CSRF obligatoire sur tout formulaire POST -->
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Se connecter
                    </button>
                </form>
                <p class="mt-3 text-center">
                    Pas encore de compte ?
                    <a href="/accounts/register/">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
