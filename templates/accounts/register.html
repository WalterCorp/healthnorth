{% extends 'base.html' %}

{% block title %}Inscription — Health North{% endblock %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3>Créer un compte</h3>
            </div>
            <div class="card-body">
                <!-- method="post" : envoie les données de façon sécurisée -->
                <form method="post">
                    <!-- csrf_token : protection contre les attaques CSRF -->
                    <!-- Django refuse tout formulaire POST sans ce token -->
                    {% csrf_token %}
                    <!-- form.as_p : Django génère automatiquement tous les champs -->
                    <!-- en les enveloppant dans des balises <p> -->
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        S'inscrire
                    </button>
                </form>
                <p class="mt-3 text-center">
                    Déjà un compte ?
                    <a href="/accounts/login/">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
