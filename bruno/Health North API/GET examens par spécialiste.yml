info:
  name: GET examens par spécialiste
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/appointments/api/exam-types/1/"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].name
      operator: eq
      value: Scanner thoracique

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
