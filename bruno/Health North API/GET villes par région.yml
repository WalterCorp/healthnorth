info:
  name: GET villes par région
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/appointments/api/cities/ile-de-france/"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0]
      operator: eq
      value: Paris

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
