  <text x="700" y="155" font-size="10" fill="#1a7a40" font-style="italic">spécialisé en</text>

  <line x1="900" y1="265" x2="900" y2="315" stroke="#1a2340" stroke-width="1.5" marker-end="url(#arrow-assoc)"/>
  <text x="910" y="283" font-size="10" fill="#1a2340">1,1</text>
  <text x="910" y="309" font-size="10" fill="#1a2340">0,n</text>
  <text x="920" y="295" font-size="10" fill="#1a2340" font-style="italic">assure</text>

  <line x1="630" y1="365" x2="770" y2="455" stroke="#b94600" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-assoc)"/>
  <text x="636" y="358" font-size="10" fill="#b94600">0,1</text>
  <text x="748" y="450" font-size="10" fill="#b94600" text-anchor="end">0,n</text>

  <line x1="630" y1="575" x2="770" y2="510" stroke="#5b2c6f" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-assoc)"/>
  <text x="636" y="572" font-size="10" fill="#5b2c6f">0,1</text>
  <text x="748" y="505" font-size="10" fill="#5b2c6f" text-anchor="end">0,n</text>

  <line x1="900" y1="555" x2="900" y2="606" stroke="#0b5345" stroke-width="1.5" marker-end="url(#arrow-assoc)"/>
  <text x="910" y="572" font-size="10" fill="#0b5345">1,1</text>
  <text x="910" y="600" font-size="10" fill="#0b5345">0,n</text>
  <text x="920" y="584" font-size="10" fill="#0b5345" font-style="italic">contient</text>

  <line x1="770" y1="230" x2="640" y2="615" stroke="#5b2c6f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="525" y1="680" x2="525" y2="706" stroke="#5b2c6f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="660" y="400" font-size="10" fill="#5b2c6f" font-style="italic">exerce dans</text>
