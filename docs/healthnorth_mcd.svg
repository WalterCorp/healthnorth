<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-assoc" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
