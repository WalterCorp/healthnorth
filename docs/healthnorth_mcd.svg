    <line x1="30" y1="130" x2="240" y2="130" stroke="#dde8f5" stroke-width="1"/>
    <text x="44" y="148" font-size="11" fill="#222">🔑 id</text>
    <text x="44" y="166" font-size="11" fill="#222">username</text>
    <text x="44" y="184" font-size="11" fill="#222">password</text>
    <text x="44" y="202" font-size="11" fill="#222">first_name</text>
    <text x="44" y="220" font-size="11" fill="#222">last_name</text>
    <text x="44" y="238" font-size="11" fill="#222">email</text>
    <text x="44" y="256" font-size="11" fill="#222">phone</text>
    <text x="44" y="274" font-size="11" fill="#222">address</text>
    <text x="44" y="292" font-size="11" fill="#222">date_of_birth</text>
    <text x="44" y="310" font-size="11" fill="#222">is_staff</text>
    <text x="44" y="328" font-size="11" fill="#555">is_active</text>
    <text x="44" y="346" font-size="11" fill="#555">date_joined</text>
    <text x="44" y="364" font-size="11" fill="#555">is_superuser</text>
  </g>

  <!-- ===== SPECIALTY ===== -->
