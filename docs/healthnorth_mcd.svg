  </defs>

  <rect width="1100" height="780" fill="#f5f7fb"/>

  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2340">MCD — Health North</text>
  <text x="550" y="54" text-anchor="middle" font-size="12" fill="#666">Modèle Conceptuel de Données</text>

  <!-- ===== USER ===== -->
